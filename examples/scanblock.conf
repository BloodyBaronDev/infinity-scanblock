# /etc/scanblock.conf — читается как bash. Адреса ниже из документационных диапазонов, замените своими.

# Никогда не блокировать: адреса и подсети (через nomatch, работает и внутри заблокированной сети).
ALLOW=(
  203.0.113.10        # администратор
  198.51.100.0/24     # офис
)

# Минимум подсетей после сборки; меньше — набор не обновляется.
#MIN_LINES=500

# Лимит записей в журнал ядра.
#LOG_LIMIT="30/minute"
#LOG_BURST=50

# Свои дополнительные источники (текст, где встречаются IPv4 или CIDR).
#EXTRA_SOURCES=(https://example.com/my-list.txt)
